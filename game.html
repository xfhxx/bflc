<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="游戏工作台">
<title>游戏工作台</title>
<link rel="manifest" href="game-manifest.json">
<link rel="apple-touch-icon" href="app-icon.jpg">
<link rel="icon" href="app-icon.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
:root{
  /* 莫兰迪色系 */
  --primary:#8B9DAA;
  --bg:#EAE6DF;
  --card:#F6F3EE;
  --text:#565248;
  --text2:#98938A;
  --text3:#C3BDB2;
  --border:#DCD6CB;
  --sidebar-bg:rgba(246,243,238,0.85);
  --level-color:#8B9DAA;
  --checkin-color:#9BB096;
  --log-color:#C8A299;
  --achv-color:#A99BB2;
  --shadow:0 2px 12px rgba(86,82,72,0.08);
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue","PingFang SC",sans-serif;background:var(--bg);color:var(--text);overflow:hidden;}
input,button,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-thumb{background:var(--text3);border-radius:3px;}
::-webkit-scrollbar-track{background:transparent;}

/* Auth Overlay */
.auth-overlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;transition:opacity .3s;}
.auth-overlay.hidden{opacity:0;pointer-events:none;}
.auth-card{background:var(--card);border-radius:20px;box-shadow:0 8px 40px rgba(0,0,0,0.1);padding:40px 32px;width:340px;max-width:90vw;}
.auth-logo{width:72px;height:72px;border-radius:18px;overflow:hidden;margin:0 auto 16px;}
.auth-logo img{width:100%;height:100%;object-fit:cover;}
.auth-title{font-size:24px;font-weight:700;text-align:center;margin-bottom:4px;}
.auth-sub{font-size:14px;color:var(--text2);text-align:center;margin-bottom:24px;}
.auth-tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);border-radius:10px;padding:3px;}
.auth-tab{flex:1;text-align:center;padding:8px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;color:var(--text2);transition:.2s;}
.auth-tab.active{background:var(--card);color:var(--primary);box-shadow:0 1px 4px rgba(0,0,0,0.08);}
.auth-field{margin-bottom:12px;}
.auth-field input{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--bg);transition:.2s;}
.auth-field input:focus{border-color:var(--primary);outline:none;}
.auth-btn{width:100%;padding:13px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s;}
.auth-btn:active{transform:scale(.97);}
.auth-btn:disabled{opacity:.5;}
.auth-err{color:#C0706A;font-size:13px;text-align:center;min-height:20px;margin-bottom:8px;}

/* Layout */
.app{display:flex;height:100%;}
.sidebar{width:200px;background:var(--sidebar-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:16px 0;flex-shrink:0;overflow-y:auto;}
.sidebar-header{padding:8px 20px 20px;display:flex;align-items:center;gap:10px;}
.sidebar-logo{width:36px;height:36px;border-radius:10px;overflow:hidden;flex-shrink:0;}
.sidebar-logo img{width:100%;height:100%;object-fit:cover;}
.sidebar-title{font-size:15px;font-weight:700;}
.sidebar-sub{font-size:11px;color:var(--text2);}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 20px;cursor:pointer;font-size:14px;color:var(--text2);transition:.2s;border-left:3px solid transparent;}
.nav-item:hover{background:rgba(0,0,0,0.03);}
.nav-item.active{color:var(--primary);border-left-color:var(--primary);background:rgba(139,157,170,0.10);}
.nav-icon{font-size:18px;width:24px;text-align:center;}
.nav-badge{margin-left:auto;background:#C0706A;color:#fff;font-size:10px;font-weight:700;border-radius:10px;min-width:18px;height:18px;display:flex;align-items:center;justify-content:center;padding:0 5px;}
.nav-badge.done{background:var(--checkin-color);}
.sidebar-footer{margin-top:auto;padding:12px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2);}
.cloud-dot{width:8px;height:8px;border-radius:50%;background:var(--checkin-color);flex-shrink:0;}
.cloud-dot.syncing{background:var(--log-color);animation:pulse 1s infinite;}
.cloud-dot.offline{background:var(--text3);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* Main */
.main{flex:1;overflow-y:auto;padding:24px 32px;}
.main-header{margin-bottom:20px;}
.main-title{font-size:28px;font-weight:700;}

/* Views */
.view{display:none;animation:fadeIn .3s;}
.view.active{display:block;}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* Level Card */
.level-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:32px;margin-bottom:20px;display:flex;align-items:center;gap:32px;}
.level-circle{position:relative;width:120px;height:120px;flex-shrink:0;}
.level-circle svg{transform:rotate(-90deg);}
.level-circle .bg-ring{fill:none;stroke:var(--border);stroke-width:8;}
.level-circle .fg-ring{fill:none;stroke:var(--level-color);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .8s ease;}
.level-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.level-num .lv-label{font-size:11px;color:var(--text2);font-weight:600;}
.level-num .lv-num{font-size:42px;font-weight:800;color:var(--text);line-height:1;}
.level-info{flex:1;}
.level-rank{font-size:15px;font-weight:700;color:var(--level-color);margin-bottom:4px;}
.level-exp-text{font-size:13px;color:var(--text2);margin-bottom:12px;}
.level-exp-text b{color:var(--text);}
.level-bar{height:10px;background:var(--border);border-radius:5px;overflow:hidden;margin-bottom:8px;}
.level-bar-fill{height:100%;background:var(--level-color);border-radius:5px;transition:width .6s ease;}
.level-stats{display:flex;gap:24px;}
.level-stat{font-size:12px;color:var(--text2);}
.level-stat b{display:block;font-size:18px;color:var(--text);font-weight:700;}

/* Check-in */
.checkin-btn{width:100%;margin-top:14px;padding:12px;border:none;border-radius:12px;background:var(--checkin-color);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.2s;}
.checkin-btn:active{transform:scale(.97);}
.checkin-btn:disabled{background:var(--text3);color:#fff;opacity:.7;cursor:not-allowed;}
/* Exp Log */
.log-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;margin-bottom:20px;}
.log-card-title{font-size:15px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:6px;}
.log-add{display:flex;gap:8px;margin-bottom:16px;}
.log-add input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);}
.log-add input:focus{border-color:var(--primary);outline:none;}
.log-add select{padding:10px 8px;border:1.5px solid var(--border);border-radius:10px;font-size:14px;background:var(--bg);}
.log-add button{padding:10px 16px;border:none;border-radius:10px;background:var(--log-color);color:#fff;font-size:14px;font-weight:600;cursor:pointer;}
.dia-preview{font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap;flex-shrink:0;}
.exp-note{background:var(--bg);border-radius:12px;padding:12px 16px;margin-bottom:16px;border-left:3px solid var(--log-color);}
.exp-note-title{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px;}
.exp-note-items{display:flex;flex-wrap:wrap;gap:6px;}
.exp-note-item{font-size:13px;color:var(--text);background:var(--card);padding:4px 10px;border-radius:6px;border:1px solid var(--border);}
.exp-note-item b{color:var(--log-color);font-weight:700;}
.log-list{max-height:400px;overflow-y:auto;}
.log-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.log-item:last-child{border-bottom:none;}
.log-icon{font-size:18px;flex-shrink:0;}
.log-text{flex:1;font-size:14px;min-width:0;}
.log-text small{color:var(--text2);font-size:12px;}
.log-amount{font-size:15px;font-weight:700;color:var(--checkin-color);white-space:nowrap;flex-shrink:0;}
.log-section-label{font-size:12px;color:var(--text2);font-weight:600;padding:12px 0 4px;border-bottom:1px solid var(--border);margin-bottom:4px;}
.log-item-actions{display:flex;gap:4px;flex-shrink:0;}
.log-edit-btn{width:28px;height:28px;border:none;border-radius:6px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.15s;}
.log-edit-btn .lico{width:14px;height:14px;}
.log-edit-btn:hover{background:rgba(86,82,72,0.08);color:var(--text);}
.log-edit-btn.danger:hover{color:#C0706A;}
.log-edit-name{flex:1;min-width:0;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);}
.log-edit-name:focus{border-color:var(--primary);outline:none;}
.log-edit-amount{width:70px;padding:6px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);text-align:center;flex-shrink:0;}
.log-edit-amount:focus{border-color:var(--primary);outline:none;}
.log-edit-save,.log-edit-cancel{padding:6px 10px;border:none;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.log-edit-save{background:var(--primary);color:#fff;}
.log-edit-cancel{background:var(--text2);color:#fff;}

/* Achievements */
.achv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;}
.achv-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;text-align:center;transition:.2s;position:relative;overflow:hidden;}
.achv-card.unlocked{border:2px solid var(--achv-color);}
.achv-card.locked{opacity:.4;}
.achv-icon{font-size:36px;margin-bottom:8px;}
.achv-name{font-size:14px;font-weight:700;margin-bottom:4px;}
.achv-desc{font-size:11px;color:var(--text2);}
.achv-date{font-size:11px;color:var(--text2);margin-top:6px;}
.achv-check{position:absolute;top:8px;right:8px;font-size:16px;color:var(--achv-color);}

/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px;margin-bottom:20px;}
.stat-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;}
.stat-label{font-size:13px;color:var(--text2);margin-bottom:8px;}
.stat-value{font-size:32px;font-weight:800;color:var(--primary);}
.stat-sub{font-size:12px;color:var(--text2);margin-top:4px;}

/* Collection Bar */
.collection-card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px;margin-bottom:20px;}
.collection-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.collection-title{font-size:17px;font-weight:700;}
.collection-total{font-size:14px;color:var(--text2);font-weight:600;margin-left:6px;}
.collection-edit-btn{display:flex;align-items:center;gap:6px;padding:8px 14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;}
.collection-edit-btn:active{transform:scale(.95);}
.collection-legend{display:flex;justify-content:center;gap:40px;margin-bottom:10px;}
.collection-legend-item{font-size:14px;color:var(--text2);display:flex;align-items:center;gap:6px;}
.collection-legend-item b{color:var(--text);font-size:16px;}
.collection-bar{display:flex;height:26px;border-radius:13px;overflow:hidden;background:var(--border);}
.collection-seg{flex:1;position:relative;overflow:hidden;}
.collection-seg:first-child{border-right:2px solid var(--card);}
.collection-fill{height:100%;width:0%;transition:width .5s ease;}
.collection-fill.cards{background:var(--primary);}
.collection-fill.artworks{background:var(--achv-color);}
.collection-items{margin-top:6px;}
.collection-empty{font-size:12px;color:var(--text3);text-align:center;padding:10px 0;}

/* 纯线条图标 & 明细整行 */
.lico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;vertical-align:-2px;}
.collection-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg);border-radius:10px;margin-top:8px;}
.coll-section .collection-row{background:var(--card);}
.collection-row-icon{display:flex;align-items:center;}
.collection-row-icon .lico{width:18px;height:18px;}
.collection-row-icon.cards{color:var(--primary);}
.collection-row-icon.artworks{color:var(--achv-color);}
.collection-row-name{flex:1;min-width:0;font-size:14px;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.collection-row-qty{font-size:13px;color:var(--text2);font-weight:600;white-space:nowrap;}
.collection-row-btn{width:30px;height:30px;border:none;border-radius:8px;background:transparent;color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s;}
.collection-row-btn .lico{width:14px;height:14px;vertical-align:0;}
.collection-row-btn:hover{background:rgba(86,82,72,0.08);color:var(--text);}
.collection-row-btn.danger:hover{color:#C0706A;}
.coll-edit-name{flex:1;min-width:0;padding:8px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);}
.coll-edit-name:focus{border-color:var(--primary);outline:none;}
.coll-edit-qty{width:60px;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);text-align:center;flex-shrink:0;}
.coll-edit-qty:focus{border-color:var(--primary);outline:none;}
.coll-edit-save{padding:8px 12px;border:none;border-radius:8px;background:var(--primary);color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}
.coll-edit-cancel{padding:8px 12px;border:none;border-radius:8px;background:var(--text2);color:#fff;font-size:12px;font-weight:600;cursor:pointer;flex-shrink:0;}

/* Collection Editor */
.coll-section{background:var(--bg);border-radius:12px;padding:16px;margin-bottom:14px;}
.coll-section-title{font-size:14px;font-weight:700;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;}
.coll-section-title span{font-size:12px;color:var(--text2);font-weight:500;}
.coll-add-row{display:flex;gap:8px;margin-bottom:10px;}
.coll-add-row input{flex:1;padding:9px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:13px;background:var(--card);}
.coll-add-row input:focus{border-color:var(--primary);outline:none;}
.coll-add-row input[type=number]{width:60px;flex:0 0 60px;text-align:center;}
.coll-add-row button{padding:9px 14px;border:none;border-radius:10px;background:var(--primary);color:#fff;font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;}
.coll-chips{margin-top:2px;}

/* Settings Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;}
.modal-overlay.show{opacity:1;pointer-events:auto;}
.modal-card{background:var(--card);border-radius:18px;box-shadow:0 8px 40px rgba(0,0,0,0.15);width:420px;max-width:90vw;max-height:80vh;overflow-y:auto;padding:28px;}
.modal-title{font-size:20px;font-weight:700;margin-bottom:20px;text-align:center;}
.settings-actions{display:flex;gap:8px;margin-top:20px;}
.settings-field{margin-bottom:16px;}
.settings-field label{display:block;font-size:13px;color:var(--text2);margin-bottom:6px;font-weight:600;}
.settings-field input{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:10px;font-size:15px;background:var(--bg);color:var(--text);transition:.2s;}
.settings-field input:focus{border-color:var(--primary);outline:none;}
.settings-actions button{flex:1;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-refresh{background:var(--bg);color:var(--text);}
.btn-logout{background:#C0706A;color:#fff;}
.btn-close{background:var(--primary);color:#fff;}

/* Level Up Animation */
.levelup-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:2000;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.3s;}
.levelup-overlay.show{opacity:1;pointer-events:auto;}
.levelup-card{text-align:center;transform:scale(.5);transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
.levelup-overlay.show .levelup-card{transform:scale(1);}
.levelup-icon{font-size:80px;margin-bottom:16px;animation:bounce .6s ease;}
.levelup-text{font-size:28px;font-weight:800;color:#fff;text-shadow:0 2px 20px rgba(0,0,0,0.3);}
.levelup-rank{font-size:18px;color:#D6C58E;margin-top:8px;}
@keyframes bounce{0%,100%{transform:translateY(0);}50%{transform:translateY(-20px);}}

/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--text);color:#fff;padding:12px 24px;border-radius:12px;font-size:14px;z-index:3000;transition:transform .3s;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}

/* Responsive */
@media(max-width:768px){
  .app{flex-direction:column;}
  .sidebar{width:100%;flex-direction:row;overflow-x:auto;border-right:none;border-bottom:1px solid var(--border);padding:8px;}
  .sidebar-header,.sidebar-footer{display:none;}
  .nav-item{flex-direction:column;gap:2px;padding:8px 14px;border-left:none;border-bottom:3px solid transparent;font-size:11px;min-width:64px;}
  .nav-item.active{border-left:none;border-bottom-color:var(--primary);}
  .nav-badge{position:absolute;top:0;right:8px;}
  .nav-item{position:relative;}
  .main{padding:16px;}
  .level-card{flex-direction:column;text-align:center;gap:16px;padding:24px;}
  .level-stats{justify-content:center;}
  .collection-legend{gap:20px;}
  .collection-header{flex-wrap:wrap;gap:8px;}
  .coll-add-row{flex-wrap:wrap;}
  .coll-add-row input[type=text]{flex:1 100%;}
  .log-add{flex-wrap:wrap;}
  .log-add input{flex:1 100%;}
}
</style>
</head>
<body>

<!-- Auth Overlay -->
<div class="auth-overlay" id="authOverlay">
  <div class="auth-card">
    <div class="auth-logo"><img src="app-icon.jpg" alt="logo"></div>
    <div class="auth-title">游戏工作台</div>
    <div class="auth-sub">升级你的每一天</div>
    <div class="auth-tabs">
      <div class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">登录</div>
      <div class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">注册</div>
    </div>
    <div id="authFormLogin">
      <div class="auth-field"><input type="text" id="loginUser" placeholder="用户名" autocomplete="username"></div>
      <div class="auth-field"><input type="password" id="loginPass" placeholder="密码" autocomplete="current-password"></div>
      <div class="auth-err" id="authError"></div>
      <button class="auth-btn" id="loginBtn" onclick="doLogin()">登录</button>
    </div>
    <div id="authFormRegister" style="display:none;">
      <div class="auth-field"><input type="text" id="regUser" placeholder="用户名（3-20位）" autocomplete="username"></div>
      <div class="auth-field"><input type="password" id="regPass" placeholder="密码（至少6位）" autocomplete="new-password"></div>
      <div class="auth-field"><input type="password" id="regPass2" placeholder="确认密码" autocomplete="new-password"></div>
      <div class="auth-err" id="authError2"></div>
      <button class="auth-btn" id="regBtn" onclick="doRegister()">注册</button>
    </div>
  </div>
</div>

<!-- Main App -->
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="sidebar-logo"><img src="app-icon.jpg" alt="logo"></div>
      <div>
        <div class="sidebar-title">游戏工作台</div>
        <div class="sidebar-sub" id="sidebarLevel">Lv.1</div>
      </div>
    </div>
    <div class="nav-item active" data-view="level" onclick="switchView('level')">
      <span class="nav-icon">🏠</span><span>主页</span>
    </div>
    <div class="nav-item" data-view="exp" onclick="switchView('exp')">
      <span class="nav-icon">⚡</span><span>经验</span>
    </div>
    <div class="nav-item" data-view="diamond" onclick="switchView('diamond')">
      <span class="nav-icon">💎</span><span>钻石</span>
    </div>
    <div class="nav-item" data-view="achievements" onclick="switchView('achievements')">
      <span class="nav-icon">🏆</span><span>成就</span>
    </div>
    <div class="nav-item" onclick="openSettings()">

<script>
// ============================================================
//  CONFIG
// ============================================================
const SB_CONFIG = {

  anonKey: 'sb_publishable_8ihI_zUf84zQNuyxMVX-cQ_1Bd6U6kq'
};
let SB = null, CB_READY = false, CB_UID = null, CB_USERNAME = null;
let cloudSaveTimer = null, cloudLoading = false;
const STORE_KEY = 'game_workbench_data';

// ============================================================
//  DATA
// ============================================================
const defaultData = {
  appName: '游戏工作台',
  totalExp: 0,
  diamonds: 0,
  checkInDates: [],
  expLog: [],
  diamondLog: [],
  totalCreations: 0,
  collection: {
    cards: { count: 0, items: [] },
    artworks: { count: 0, items: [] }
  },
  achievements: []
};
let DB = JSON.parse(JSON.stringify(defaultData));

// ============================================================
//  LEVEL SYSTEM
// ============================================================
function getExpForLevel(level){
  return 200 * Math.pow(level - 1, 2);
}
function getLevelFromExp(totalExp){
  let level = 1;
  for(let l = 1; l <= 100; l++){
    if(totalExp >= getExpForLevel(l)) level = l;
    else break;
  }
  return Math.min(level, 100);
}
function getExpInLevel(totalExp){
  const lvl = getLevelFromExp(totalExp);
  if(lvl >= 100) return { current: totalExp - getExpForLevel(100), needed: 0, progress: 1 };
  const base = getExpForLevel(lvl);
  const next = getExpForLevel(lvl + 1);
  const current = totalExp - base;
  const needed = next - base;
  return { current, needed, progress: current / needed };
}
function getRank(level){
  const ranks = [
    [1,5,'见习生'], [6,10,'初学者'], [11,20,'探索者'], [21,30,'进阶者'],
    [31,40,'熟练者'], [41,50,'精通者'], [51,60,'专家'], [61,70,'大师'],
    [71,80,'宗师'], [81,90,'传奇'], [91,99,'神话'], [100,100,'行无止境']
  ];
  for(const [min, max, name] of ranks){
    if(level >= min && level <= max) return name;
  }
  return '见习生';
}

// ============================================================
//  COLLECTION (仓库明细: 50 件美工 + 50 个绘画)
// ============================================================
const COLLECTION_CAP = { cards: 50, artworks: 50 };
const LIC = {
  brush: '<svg class="lico" viewBox="0 0 24 24"><path d="M9.06 11.9l8.07-8.06a2.85 2.85 0 1 1 4.03 4.03l-8.06 8.08"/><path d="M7.07 14.94c-1.66 0-3 1.35-3 3.02 0 1.33-2.5 1.52-2 2.02 1.08 1.1 2.49 2.02 4 2.02 2.2 0 4-1.8 4-4.04a3.01 3.01 0 0 0-3-3.02z"/></svg>',
  palette: '<svg class="lico" viewBox="0 0 24 24"><circle cx="13.5" cy="6.5" r=".5"/><circle cx="17.5" cy="10.5" r=".5"/><circle cx="8.5" cy="7.5" r=".5"/><circle cx="6.5" cy="12.5" r=".5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg>',
  pencil: '<svg class="lico" viewBox="0 0 24 24"><path d="M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/></svg>',
  x: '<svg class="lico" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>'
};
let collEditState = null;
let logEditState = null;
let diaLogEditState = null;
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}
function itemQty(it){
  return typeof it === 'object' && it ? Math.max(1, parseInt(it.qty, 10) || 1) : 1;
}
function collectionRowHtml(key, it, idx, ctx){
  const editing = collEditState && collEditState.key === key && collEditState.idx === idx && collEditState.ctx === ctx;
  if(editing){
    const keyHandler = "if(event.key==='Enter')saveCollEdit();if(event.key==='Escape')cancelCollEdit();";
    return '<div class="collection-row">' +
      '<input class="coll-edit-name" id="collEditName" value="' + escapeHtml(it.name) + '" onkeydown="' + keyHandler + '">' +
      '<input class="coll-edit-qty" id="collEditQty" type="number" min="1" value="' + itemQty(it) + '" onkeydown="' + keyHandler + '">' +
      '<button class="coll-edit-save" onclick="saveCollEdit()">保存</button>' +
      '<button class="coll-edit-cancel" onclick="cancelCollEdit()">取消</button>' +
    '</div>';
  }
  const qty = itemQty(it);
  const actions = ctx === 'editor'
    ? '<button class="collection-row-btn" title="编辑" onclick="startCollEdit(\'' + key + '\',' + idx + ',\'' + ctx + '\')">' + LIC.pencil + '</button>' +
      '<button class="collection-row-btn danger" title="删除" onclick="removeCollectionItem(\'' + key + '\',' + idx + ')">' + LIC.x + '</button>'
    : '';
  return '<div class="collection-row">' +
    '<span class="collection-row-icon ' + key + '">' + (key === 'cards' ? LIC.brush : LIC.palette) + '</span>' +
    '<span class="collection-row-name">' + escapeHtml(it.name) + '</span>' +
    (qty > 1 ? '<span class="collection-row-qty">×' + qty + '</span>' : '') +
    actions +
  '</div>';
}
function startCollEdit(key, idx, ctx){
  collEditState = { key, idx, ctx };
  renderCollection();
  const el = document.getElementById('collEditName');
  if(el){ el.focus(); el.select(); }
}
function cancelCollEdit(){
  collEditState = null;
  renderCollection();
}
function saveCollEdit(){
  if(!collEditState) return;
  const name = document.getElementById('collEditName').value.trim();
  const qty = document.getElementById('collEditQty').value;
  if(updateCollectionItem(collEditState.key, collEditState.idx, name, qty)){
    collEditState = null;
    renderCollection();
  }
}
function updateCollectionItem(key, idx, name, qty){
  const it = DB.collection[key].items[idx];
  if(!it) return false;
  if(!name){ showToast('请输入名称'); return false; }
  qty = (qty === undefined || qty === '') ? 1 : parseInt(qty, 10);
  if(isNaN(qty) || qty < 1){ showToast('请输入有效数量'); return false; }
  const otherCount = DB.collection[key].count - itemQty(it);
  const maxQty = COLLECTION_CAP[key] - otherCount;
  if(qty > maxQty){ qty = maxQty; showToast('数量超出上限，已调整为 ' + qty); }
  if(qty < 1){ showToast('该分类已满，无法保存'); return false; }
  DB.collection[key].count = otherCount + qty;
  it.name = name;
  it.qty = qty;
  scheduleSave();
  return true;
}
function normalizeCollection(){
  const c = DB.collection || {};
  const fix = key => {
    const v = c[key] || {};
    const raw = Array.isArray(v.items) ? v.items : [];
    const items = [];
    for(const it of raw){
      if(typeof it === 'string'){
        if(it) items.push({ name: it, qty: 1 });
      } else if(it && typeof it === 'object' && typeof it.name === 'string' && it.name){
        items.push({ name: it.name, qty: itemQty(it) });
      }
      if(items.length >= COLLECTION_CAP[key]) break;
    }
    return {
      count: Math.min(COLLECTION_CAP[key], Math.max(0, parseInt(v.count, 10) || 0)),
      items
    };
  };
  DB.collection = { cards: fix('cards'), artworks: fix('artworks') };
}
function collectionTotal(){
  return DB.collection.cards.count + DB.collection.artworks.count;
}
function collectionFull(key){
  return DB.collection[key].count >= COLLECTION_CAP[key];
}
function addCollectionItem(key, name, qty){
  if(collectionFull(key)){ showToast(key === 'cards' ? '美工已满 50 件' : '绘画已满 50 幅'); return false; }
  if(!name){ showToast('请输入名称'); return false; }
  qty = (qty === undefined || qty === '') ? 1 : parseInt(qty, 10);
  if(isNaN(qty) || qty < 1){ showToast('请输入有效数量'); return false; }
  const room = COLLECTION_CAP[key] - DB.collection[key].count;
  if(qty > room){
    showToast('数量超出剩余容量，已添加 ' + room + ' 件');
    qty = room;
  }
  DB.collection[key].count += qty;
  DB.collection[key].items.push({ name, qty });
  scheduleSave();
  renderCollection();
  return true;
}
function removeCollectionItem(key, idx){
  const it = DB.collection[key].items[idx];
  if(!it) return;
  DB.collection[key].items.splice(idx, 1);
  DB.collection[key].count = Math.max(0, DB.collection[key].count - itemQty(it));
  collEditState = null;
  scheduleSave();
  renderCollection();
}

// ============================================================
//  ACHIEVEMENTS
// ============================================================
const ACHIEVEMENTS = [
  { id:'level_10', icon:'🌱', name:'初露锋芒', desc:'达到10级', check:d=>getLevelFromExp(d.totalExp)>=10 },
  { id:'level_25', icon:'🌿', name:'小有成就', desc:'达到25级', check:d=>getLevelFromExp(d.totalExp)>=25 },
  { id:'level_50', icon:'🌳', name:'半程勇士', desc:'达到50级', check:d=>getLevelFromExp(d.totalExp)>=50 },
  { id:'level_75', icon:'🌲', name:'经验丰富', desc:'达到75级', check:d=>getLevelFromExp(d.totalExp)>=75 },
  { id:'level_100', icon:'👑', name:'满级达成', desc:'达到100级', check:d=>getLevelFromExp(d.totalExp)>=100 },
  { id:'diamond_500', icon:'💎', name:'钻石新秀', desc:'累计获得500颗钻石', check:d=>(d.diamonds||0)>=500 },
  { id:'diamond_10000', icon:'💎', name:'钻石大亨', desc:'累计获得10000颗钻石', check:d=>(d.diamonds||0)>=10000 },
  { id:'create_50', icon:'🌱', name:'播种者', desc:'累计完成50次创作', check:d=>(d.totalCreations||0)>=50 },
  { id:'create_500', icon:'🌿', name:'耕耘者', desc:'累计完成500次创作', check:d=>(d.totalCreations||0)>=500 },
  { id:'create_2500', icon:'🌳', name:'绿树成荫', desc:'累计完成2500次创作', check:d=>(d.totalCreations||0)>=2500 },
  { id:'create_5000', icon:'🌸', name:'百花齐放', desc:'累计完成5000次创作', check:d=>(d.totalCreations||0)>=5000 },
  { id:'create_10000', icon:'👑', name:'硕果累累', desc:'累计完成10000次创作', check:d=>(d.totalCreations||0)>=10000 },
];

function checkAchievements(){
  const newly = [];
  for(const a of ACHIEVEMENTS){
    const unlocked = DB.achievements.find(x => (typeof x === 'string' ? x : x.id) === a.id);
    if(!unlocked && a.check(DB)){
      DB.achievements.push({ id: a.id, date: todayStr() });
      newly.push(a);
    }
  }
  return newly;
}
function isoDate(iso){
  if(!iso) return '';
  const d = new Date(iso);
  if(isNaN(d.getTime())) return '';
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function isCreationEntry(e){
  return e.amount > 0 && e.source && e.source !== '每日签到' && !e.source.startsWith('批量卖出');
}
function getCreationDates(){
  return (DB.expLog || [])
    .filter(isCreationEntry)
    .map(e => isoDate(e.date))
    .filter(Boolean)
    .sort();
}
function reconstructAchievementDate(id){
  const entries = [...(DB.expLog || [])].reverse();
  if(entries.length === 0) return null;
  if(id.startsWith('level_')){
    const th = getExpForLevel(parseInt(id.slice(6), 10));
    let exp = 0;
    for(const e of entries){
      exp += e.amount;
      if(exp >= th) return isoDate(e.date) || null;
    }
    return null;
  }
  if(id.startsWith('create_')){
    const n = parseInt(id.slice(7), 10);
    const cds = getCreationDates();
    return cds.length >= n ? cds[n-1] : null;
  }
  if(id.startsWith('diamond_')){
    const n = parseInt(id.slice(8), 10);
    let dia = 0;
    const diaEntries = [...(DB.diamondLog || [])].reverse();
    for(const e of diaEntries){
      dia += e.amount;
      if(dia >= n) return isoDate(e.date) || null;
    }
    return null;
  }
  return null;
}
function migrateData(){
  let changed = false;
  normalizeCollection();
  if(!DB.creationMigrated){
    const cds = getCreationDates();
    DB.totalCreations = cds.length;
    for(const a of ACHIEVEMENTS){
      if(!a.id.startsWith('create_')) continue;
      const n = parseInt(a.id.slice(7), 10);
      if(cds.length >= n && !DB.achievements.find(x => (typeof x === 'string' ? x : x.id) === a.id)){
        DB.achievements.push({ id: a.id, date: cds[n-1] });
      }
    }
    DB.creationMigrated = true;
    changed = true;
  }
  const out = [];
  for(const rec of DB.achievements){
    const id = typeof rec === 'string' ? rec : rec.id;
    if(!id) continue;
    const hadDate = typeof rec === 'object' && !!rec.date;
    const date = hadDate ? rec.date : (reconstructAchievementDate(id) || todayStr());
    if(!hadDate) changed = true;
    out.push({ id, date });
  }
  DB.achievements = out;
  if(changed){
    checkAchievements();
    scheduleSave();
  }
}

function simpleHash(str){
  let h=0;
  for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; }
  return String(h);
}
function uid(){
  return 'g_' + Date.now().toString(36) + Math.random().toString(36).substr(2,8);
}

async function doRegister(){
  const u = document.getElementById('regUser').value.trim();
  const p = document.getElementById('regPass').value;
  const p2 = document.getElementById('regPass2').value;
  if(u.length<3||u.length>20){ showAuthError('用户名需要 3-20 位', true); return; }
  if(p.length<6){ showAuthError('密码至少 6 位', true); return; }
  if(p!==p2){ showAuthError('两次密码不一致', true); return; }
  const btn = document.getElementById('regBtn'); btn.disabled=true; btn.textContent='注册中…';
  try {
    const { data: existing } = await SB.from('game_users').select('uid').eq('username', u);
    if(existing && existing.length>0){ showAuthError('用户名已存在', true); return; }
    CB_UID = uid();
    const { error } = await SB.from('game_users').insert({
      uid: CB_UID, username: u, password: simpleHash(p)
    });
    if(error){ showAuthError('注册失败: '+error.message, true); return; }
    CB_USERNAME = u;
    localStorage.setItem('game_uid', CB_UID);
    localStorage.setItem('game_user', u);
    await afterAuth();
  } catch(e){
    showAuthError(e.message||'注册失败', true);
  } finally { btn.disabled=false; btn.textContent='注册'; }
}
async function doLogin(){
  const u = document.getElementById('loginUser').value.trim();
  const p = document.getElementById('loginPass').value;
  if(!u||!p){ showAuthError('请填写用户名和密码'); return; }
  const btn = document.getElementById('loginBtn'); btn.disabled=true; btn.textContent='登录中…';
  try {
    const { data: users, error } = await SB.from('game_users').select('*').eq('username', u);
    if(error){ showAuthError('查询失败: '+error.message); return; }
    if(!users || users.length===0){ showAuthError('用户名不存在'); return; }
    if(users[0].password !== simpleHash(p)){ showAuthError('密码错误'); return; }
    CB_UID = users[0].uid;
    CB_USERNAME = u;
    localStorage.setItem('game_uid', CB_UID);
    localStorage.setItem('game_user', u);
    await afterAuth();
  } catch(e){
    showAuthError(e.message||'登录失败');
  } finally { btn.disabled=false; btn.textContent='登录'; }
}

//  CLOUD SYNC
// ============================================================
async function loadCloudDB(){
  if(!CB_READY||!CB_UID) return;
  cloudLoading = true;
  document.getElementById('cloudDot').className = 'cloud-dot syncing';
  document.getElementById('cloudUser').textContent = '同步中…';
  try {
    const { data, error } = await SB.from('game_data').select('data').eq('uid', CB_UID);
    if(error) throw error;
    if(data && data.length>0){
      const cloudData = data[0].data;
      if(cloudData){
        DB = Object.assign({}, defaultData, cloudData);
        migrateData();
        localStorage.setItem(STORE_KEY, JSON.stringify(DB));
      }
    } else {
      await saveCloudDB(true);
    }
    document.getElementById('cloudDot').className = 'cloud-dot';
    document.getElementById('cloudUser').textContent = CB_USERNAME;
  } catch(e){
    console.error('Cloud load error', e);
    document.getElementById('cloudDot').className = 'cloud-dot offline';
    document.getElementById('cloudUser').textContent = '离线模式';
    const local = localStorage.getItem(STORE_KEY);
    if(local){
      DB = Object.assign({}, defaultData, JSON.parse(local));
      migrateData();
    }
  } finally {
    cloudLoading = false;
    refreshAllUI();
  }
}
async function saveCloudDB(force){
  if(!CB_READY||!CB_UID) return;
  if(!force && cloudLoading) return;
  document.getElementById('cloudDot').className = 'cloud-dot syncing';
  document.getElementById('cloudUser').textContent = '同步中…';
  try {
    const slim = JSON.parse(JSON.stringify(DB));
    const { data: existing } = await SB.from('game_data').select('id').eq('uid', CB_UID);
    if(existing && existing.length>0){
      const { error } = await SB.from('game_data')
        .update({ data: slim, updated_at: new Date().toISOString() })
        .eq('uid', CB_UID);
      if(error) throw error;
    } else {
      const { error } = await SB.from('game_data').insert({
        uid: CB_UID, data: slim
      });
      if(error) throw error;
    }
    document.getElementById('cloudDot').className = 'cloud-dot';
    document.getElementById('cloudUser').textContent = CB_USERNAME;
  } catch(e){
    console.error('Cloud save error', e);
    document.getElementById('cloudDot').className = 'cloud-dot offline';
    document.getElementById('cloudUser').textContent = '离线模式';
  }
}
function scheduleSave(){
  localStorage.setItem(STORE_KEY, JSON.stringify(DB));
  clearTimeout(cloudSaveTimer);
  cloudSaveTimer = setTimeout(()=>saveCloudDB(false), 1000);
}

function entryDateKey(iso){
  const d = new Date(iso);
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addExp(amount, source){
  if(amount <= 0) return;
  const oldLevel = getLevelFromExp(DB.totalExp);
  DB.totalExp += amount;
  const today = entryDateKey(new Date().toISOString());
  const existing = DB.expLog.find(e => e.source === source && entryDateKey(e.date) === today);
  if(existing){
    existing.amount += amount;
    existing.date = new Date().toISOString();
  } else {
    DB.expLog.unshift({ source, amount, date: new Date().toISOString() });
  }
  if(DB.expLog.length > 500) DB.expLog = DB.expLog.slice(0, 500);
  const newLevel = getLevelFromExp(DB.totalExp);
  const newly = checkAchievements();
  scheduleSave();
  refreshAllUI();
  if(newLevel > oldLevel){
    showLevelUp(newLevel);
  }
  if(newly.length > 0){
    for(const a of newly){
      showToast('🏆 成就解锁: ' + a.name);
    }
  }
}

function renderLog(){
  const list = document.getElementById('logList');
  if(DB.expLog.length === 0){
    list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:24px;">暂无记录</div>';
    return;
  }
  const today = entryDateKey(new Date().toISOString());
  const todayEntries = [];
  const pastMap = {};
  for(let i = 0; i < DB.expLog.length; i++){
    const e = DB.expLog[i];
    if(entryDateKey(e.date) === today){
      todayEntries.push({ ...e, idx: i });
    } else {
      if(!pastMap[e.source]) pastMap[e.source] = { source: e.source, amount: 0, count: 0, latestDate: '' };
      pastMap[e.source].amount += e.amount;
      pastMap[e.source].count++;
      if(e.date > pastMap[e.source].latestDate) pastMap[e.source].latestDate = e.date;
    }
  }
  let html = '';
  if(todayEntries.length > 0){
    html += '<div class="log-section-label">今日记录</div>';
    html += todayEntries.map(e => logItemHtml(e, 'today', e.idx)).join('');
  }
  const pastList = Object.values(pastMap).sort((a,b) => b.latestDate.localeCompare(a.latestDate));
  if(pastList.length > 0){
    html += '<div class="log-section-label">历史汇总</div>';
    html += pastList.map(e => logItemHtml(e, 'past', -1)).join('');
  }
  list.innerHTML = html;
}

function renderDiamondLog(){
  const list = document.getElementById('diaList');
  const log = DB.diamondLog || [];
  if(log.length === 0){
    list.innerHTML = '<div style="text-align:center;color:var(--text2);padding:24px;">暂无钻石记录</div>';
    return;
  }
  const today = entryDateKey(new Date().toISOString());
  const todayEntries = [];
  const pastMap = {};
  for(let i = 0; i < log.length; i++){
    const e = log[i];
    if(entryDateKey(e.date) === today){
      todayEntries.push({ ...e, idx: i });
    } else {
      if(!pastMap[e.source]) pastMap[e.source] = { source: e.source, amount: 0, count: 0, latestDate: '' };
      pastMap[e.source].amount += e.amount;
      pastMap[e.source].count++;
      if(e.date > pastMap[e.source].latestDate) pastMap[e.source].latestDate = e.date;
    }
  }
  let html = '';
  if(todayEntries.length > 0){
    html += '<div class="log-section-label">今日记录</div>';
    html += todayEntries.map(e => diaLogItemHtml(e, 'today', e.idx)).join('');
  }
  const pastList = Object.values(pastMap).sort((a,b) => b.latestDate.localeCompare(a.latestDate));
  if(pastList.length > 0){
    html += '<div class="log-section-label">历史汇总</div>';
    html += pastList.map(e => diaLogItemHtml(e, 'past', -1)).join('');
  }
  list.innerHTML = html;
}
function renderAchievements(){
  const grid = document.getElementById('achvGrid');
  const unlocked = ACHIEVEMENTS.filter(a=>DB.achievements.find(x => (typeof x === 'string' ? x : x.id) === a.id)).length;
  document.getElementById('achvCount').textContent = '(' + unlocked + '/' + ACHIEVEMENTS.length + ')';
  grid.innerHTML = ACHIEVEMENTS.map(a=>{
    const found = DB.achievements.find(x => (typeof x === 'string' ? x : x.id) === a.id);
    const isUnlocked = !!found;
    const date = found && typeof found === 'object' && found.date ? found.date : '';
    return '<div class="achv-card '+(isUnlocked?'unlocked':'locked')+'">'+(isUnlocked?'<div class="achv-check">✓</div>':'')+'<div class="achv-icon">'+a.icon+'</div><div class="achv-name">'+a.name+'</div><div class="achv-desc">'+a.desc+'</div>'+(date?'<div class="achv-date">达成于 '+date+'</div>':'')+'</div>';
  }).join('');
}
// ============================================================
//  SETTINGS
// ============================================================
function applyAppName(){
  const name = DB.appName || '游戏工作台';
  document.title = name;
  document.querySelector('meta[name="apple-mobile-web-app-title"]').setAttribute('content', name);
  const authTitle = document.querySelector('.auth-title');
  if(authTitle) authTitle.textContent = name;
  const sidebarTitle = document.querySelector('.sidebar-title');
  if(sidebarTitle) sidebarTitle.textContent = name;
}
function saveAppName(){
  const val = document.getElementById('appNameInput').value.trim();
  if(!val){ showToast('请输入名称'); return; }
  DB.appName = val;
  applyAppName();
  scheduleSave();
  showToast('名称已更新');
}
function openSettings(){
  document.getElementById('appNameInput').value = DB.appName || '游戏工作台';
  document.getElementById('settingsModal').classList.add('show');
}
function closeSettings(){
  document.getElementById('settingsModal').classList.remove('show');
}

// ============================================================
//  ANIMATIONS
// ============================================================
function showLevelUp(level){
  const overlay = document.getElementById('levelupOverlay');
  document.getElementById('levelupText').textContent = 'Lv.' + level;
  document.getElementById('levelupRank').textContent = getRank(level);
  overlay.classList.add('show');
  setTimeout(()=>overlay.classList.remove('show'), 2500);
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

// ============================================================
//  INIT
// ============================================================
async function init(){
  const local = localStorage.getItem(STORE_KEY);
  if(local){
    DB = Object.assign({}, defaultData, JSON.parse(local));
    migrateData();
  }
  if(initSupabase()){
    const savedUid = localStorage.getItem('game_uid');
    const savedUser = localStorage.getItem('game_user');
    if(savedUid && savedUser){
      CB_UID = savedUid;
      CB_USERNAME = savedUser;
      document.getElementById('authOverlay').classList.add('hidden');
      document.getElementById('cloudDot').className = 'cloud-dot';
      document.getElementById('cloudUser').textContent = CB_USERNAME;
      refreshAllUI();
      await loadCloudDB();
    } else {
      refreshAllUI();
    }
  } else {
    document.getElementById('authOverlay').classList.add('hidden');
    document.getElementById('cloudDot').className = 'cloud-dot offline';
    document.getElementById('cloudUser').textContent = '本地模式';
    refreshAllUI();
  }
}
init();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./game-sw.js').catch(()=>{});
}
</script>
